<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title>QuoteBase - Delete Quotes</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A simple quote database web application.">
        <meta name="keywords" content="quotes, database, web application">
        <meta name="author" content="Wyatt Whitaker">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #ebca84;
                border:#1c114d 1px solid;
                border-radius: 25px;
                padding: 20px;
                width: 50%;
            }
            h1 {
                color: #1c114d;
            }
            form {
                display: flex;
                flex-direction: column;
                max-width: 400px;
            }
            label {
                margin-top: 10px;
            }
            textarea, input {
                margin-top: 5px;
                padding: 8px;
                font-size: 14px;
            }
            button {
                margin-top: 15px;
                padding: 10px;
                background-color: #1c114d;
                color: white;
                border: none;
                cursor: pointer;
            }
            button:hover {
                background-color: #3a2a7a;
            }
            a {
                display: block;
                margin-top: 20px;
                text-decoration: none;
                color: #007BFF;
            }
            a:hover {
                text-decoration: underline;
            }
            form button {
                display: inline-block;
                margin-left: 10px;
                border: #1c114d 1px solid;
                border-radius: 5px;
                padding-bottom: 5px;
            }
            li {
                margin-bottom: 10px;
                border:#1c114d 1px solid;
                border-radius: 25px;
                padding: 10px;
                background-color: #b8d7f8;
                width: 50%;
            }
            ul {
                list-style-type: none;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <h1>Delete Quote</h1>
        <p><a href="/">Back to home</a></p>
        <p>Select a quote to delete:</p>
        <ul>
            {% for quote in quotes %}
            <li>
                "{{ quote.text }}" - {{ quote.author }}
                <form action="/delete-quote" method="POST" style="display:inline;">
                    <input type="hidden" name="text" value="{{ quote.text }}">
                    <input type="hidden" name="author" value="{{ quote.author }}">
                    <br>
                    <button type="submit">Delete</button>
                    <br>
                </form>
            </li>
            {% endfor %}
        </ul>
        <p><a href="/">Back to home</a></p>
    </body>
    <script>
        // Add any necessary JavaScript here
        // add an event listener to the delete buttons to confirm deletion and send a POST request to the server
        // edit this so that the request sends a json object with the quote text and author to the server
        const deleteButtons = document.querySelectorAll('button[type="submit"]');
        deleteButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                if (!confirm('Are you sure you want to delete this quote?')) {
                    e.preventDefault();
                } else {
                    e.preventDefault();
                    // Send the quote as JSON so the server can parse the request body
                    const form = button.closest('form');
                    const formData = new FormData(form);
                    const quote = Object.fromEntries(formData.entries());
                    fetch('/quotes/delete-quote', {
                        method: 'POST',
                        body: JSON.stringify(quote),
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        }
                    }).then(response => {
                        if (response.ok) {
                            // Remove the quote from the list
                            form.closest('li').remove();
                        } else {
                            alert('Failed to delete quote.');
                        }
                    }).catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred while deleting the quote.');
                    });
                }
            });
        });
    </script>
</html>
