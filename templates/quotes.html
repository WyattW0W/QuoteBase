<!DOCTYPE html>
<html lang="en">
    <head>
        <title>QuoteBase - Quotes</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A simple quote database web application.">
        <meta name="keywords" content="quotes, database, web application">
        <meta name="author" content="Wyatt Whitaker">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #ebca84;
                border:#1c114d 1px solid;
                border-radius: 25px;
                padding: 20px;
                width: 50%;
            }
            h1 {
                color: #1c114d;
            }
            ul {
                list-style-type: none;
                padding: 0;
            }
            li {
                margin-bottom: 10px;
                border:#1c114d 1px solid;
                border-radius: 25px;
                padding: 10px;
                background-color: #b8d7f8;
                width: 50%;
            }
            a {
                text-decoration: none;
                color: #007BFF;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <h1>QuoteBase - Quotes</h1>
        <p>Here are some quotes from our database:</p>
        <ul id="quote_list"></ul>
        <a href="/">Back to Home</a>
        <form>
            <label for="quote_text">Quote Text:</label>
            <textarea id="quote_text" name="quote_text" required></textarea>
            <label for="quote_author">Author:</label>
            <input type="text" id="quote_author" name="quote_author" required>
            <button type="submit">Add Quote</button>
        </form>
    </body>
    <script>
        // Get the quote list element and fill it with quotes from the database sent by the server
        const quoteList = document.getElementById('quote_list');

        const quotes = {{ quotes | tojson }};
        console.log(quotes); // Log the quotes to the console for debugging
        
        // Example of how to populate the list (replace with actual data from the server)
        quotes.forEach(quote => {
            const li = document.createElement('li');
            li.innerHTML = quote.text + ' <br>- ' + quote.author;
            quoteList.appendChild(li);
        });

        // Handle form submission
        const form = document.querySelector('form');
        form.addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent the default form submission behavior

            const quoteText = document.getElementById('quote_text').value;
            const quoteAuthor = document.getElementById('quote_author').value;

            // Send the quote data to the server
            try {
                const response = await fetch('/add-quote', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: quoteText, author: quoteAuthor })
                });

                if (response.ok) {
                    alert('Quote added successfully!');
                    form.reset(); // Reset the form fields
                } else {
                    alert('Failed to add quote. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while adding the quote.');
            }
        });
    </script>
</html>
