<!DOCTYPE html>
<html lang="en">
    <head>
        <title>QuoteBase - Quotes</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A simple quote database web application.">
        <meta name="keywords" content="quotes, database, web application">
        <meta name="author" content="Wyatt Whitaker">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #ebca84;
                border:#1c114d 1px solid;
                border-radius: 25px;
                padding: 20px;
                width: 50%;
            }
            h1 {
                color: #1c114d;
            }
            ul {
                list-style-type: none;
                padding: 0;
            }
            li {
                margin-bottom: 10px;
                border:#1c114d 1px solid;
                border-radius: 25px;
                padding: 10px;
                background-color: #b8d7f8;
                width: 50%;
            }
            a {
                text-decoration: none;
                color: #007BFF;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <h1>QuoteBase - Quotes</h1>
        <p><a href="/">Back to home</a></p>
        <p>Here are the quotes from our database:</p>
        
        <ul>
            {% for quote in quotes %}
            <li>
                "{{ quote.text }}" - {{ quote.author }}
                <form action="/delete-quote" method="POST" style="display:inline;">
                    <input type="hidden" name="text" value="{{ quote.text }}">
                    <input type="hidden" name="author" value="{{ quote.author }}">
                    <br>
                    <button type="submit">Delete</button>
                    <br>
                </form>
            </li>
            {% endfor %}
        </ul>

        <a href="/">Back to Home</a>
        <form id="add-quote">
            <label for="quote_text">Quote Text:</label>
            <textarea id="quote_text" name="quote_text" required></textarea>
            <br>
            <label for="quote_author">Author:</label>
            <input type="text" id="quote_author" name="quote_author" required>
            <br>
            <button type="submit" class="delete">Add Quote</button>
        </form>

    </body>
    <script>
        // Handle creation form submission
        const creationForm = document.querySelector('#add-quote');
        creationForm.addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent the default form submission behavior

            const quoteText = document.getElementById('quote_text').value;
            const quoteAuthor = document.getElementById('quote_author').value;

            // Send the quote data to the server
            try {
                const response = await fetch('/quotes/add-quote', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: quoteText, author: quoteAuthor })
                });

                if (response.ok) {
                    alert('Quote added successfully!');
                    location.reload(); // Reset the page to show the new quote
                } else {
                    alert('Failed to add quote. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while adding the quote.');
            }
        });

        // Make the delete buttons functional
        const deleteButtons = document.querySelectorAll('.delete');
        deleteButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                if (!confirm('Are you sure you want to delete this quote?')) {
                    e.preventDefault();
                } else {
                    e.preventDefault();
                    // Send the quote as JSON so the server can parse the request body
                    const form = button.closest('form');
                    const formData = new FormData(form);
                    const quote = Object.fromEntries(formData.entries());
                    fetch('/quotes/delete-quote', {
                        method: 'POST',
                        body: JSON.stringify(quote),
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        }
                    }).then(response => {
                        if (response.ok) {
                            // Remove the quote from the list
                            form.closest('li').remove();
                        } else {
                            alert('Failed to delete quote.');
                        }
                    }).catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred while deleting the quote.');
                    });
                }
            });
        });
    </script>
</html>
