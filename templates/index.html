<!DOCTYPE html>
<html lang="en">
    <head>
        <title>QuoteBase</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A simple quote database web application.">
        <meta name="keywords" content="quotes, database, web application">
        <meta name="author" content="Wyatt Whitaker">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #ebca84;
                border:#1c114d 1px solid;
                border-radius: 25px;
                padding: 20px;
                width: 50%;
            }
            h1 {
                color: #1c114d;
            }
            ul {
                list-style-type: none;
                padding: 0;
            }
            li {
                margin-bottom: 10px;
            }
            a {
                text-decoration: none;
                color: #007BFF;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <h1>QuoteBase</h1>
        <p>Welcome to QuoteBase! Click on the below links to explore the quotes.</p>
        <ul>
            <li><a href="/quotes">View Quotes</a></li>
            <li><a href="/add-quote-template">Add a Quote</a></li>
            <li><a href="/cat-and-mouse">Play Cat & Mouse</a></li>
        </ul>
